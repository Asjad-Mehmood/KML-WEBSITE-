<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel to KML Pro — Launching Web App</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <link rel="apple-touch-icon" href="assets/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #050B10;
      color: #F1F5F9;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Ambient GIS glow background */
    body::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, rgba(255, 209, 0, 0.05) 45%, transparent 70%);
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
    }

    .loader-card {
      position: relative;
      z-index: 1;
      background: rgba(14, 32, 45, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 20px;
      padding: 44px 40px;
      width: 90%;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 40px rgba(56, 189, 248, 0.1);
      animation: cardFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .brand-icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 20px;
      border-radius: 16px;
      background: linear-gradient(135deg, #16364A, #081B24);
      border: 1px solid rgba(56, 189, 248, 0.3);
      display: grid;
      place-items: center;
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.2);
      position: relative;
    }

    .brand-icon img {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }

    .brand-title {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .brand-title span.pro {
      color: #FFD100;
      background: rgba(255, 209, 0, 0.12);
      border: 1px solid rgba(255, 209, 0, 0.3);
      padding: 1px 7px;
      border-radius: 4px;
      font-size: 15px;
      vertical-align: middle;
      margin-left: 4px;
    }

    .brand-sub {
      font-size: 12.5px;
      color: #64748B;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      margin-bottom: 28px;
    }

    /* Radar sweep animation */
    .radar-container {
      position: relative;
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      border-radius: 50%;
      border: 2px solid rgba(56, 189, 248, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .radar-sweep {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border-top: 2px solid #FFD100;
      animation: radarSpin 1.1s linear infinite;
    }

    @keyframes radarSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .radar-dot {
      width: 10px;
      height: 10px;
      background: #38BDF8;
      border-radius: 50%;
      box-shadow: 0 0 12px #38BDF8;
      animation: dotPulse 1.4s ease-in-out infinite alternate;
    }

    @keyframes dotPulse {
      from { transform: scale(0.8); opacity: 0.7; }
      to { transform: scale(1.3); opacity: 1; }
    }

    /* Progress bar */
    .progress-bar-wrap {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 35%;
      background: linear-gradient(90deg, #38BDF8, #FFD100);
      border-radius: 999px;
      animation: progressIndeterminate 1.8s ease-in-out infinite;
    }

    @keyframes progressIndeterminate {
      0% { transform: translateX(-100%); width: 30%; }
      50% { width: 60%; }
      100% { transform: translateX(350%); width: 30%; }
    }

    .status-text {
      font-size: 13.5px;
      color: #94A3B8;
      font-weight: 500;
      margin-bottom: 12px;
      min-height: 20px;
    }

    .repo-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #38BDF8;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 4px 10px;
      border-radius: 6px;
    }

    .error-box {
      display: none;
      margin-top: 18px;
      padding: 14px;
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.3);
      border-radius: 8px;
      font-size: 12.5px;
      color: #FDA4AF;
      text-align: left;
    }

    .btn-retry {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      background: #FFD100;
      color: #171802;
      border: none;
      padding: 9px 18px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-retry:hover {
      background: #FFE043;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div class="loader-card" id="loaderCard">
    <div class="brand-icon">
      <img src="assets/icon.png" alt="Excel to KML Pro">
    </div>

    <h1 class="brand-title">Excel to KML <span class="pro">PRO</span></h1>
    <div class="brand-sub">Survey Benchmark Engine</div>

    <div class="radar-container" id="radarAnim">
      <div class="radar-sweep"></div>
      <div class="radar-dot"></div>
    </div>

    <div class="progress-bar-wrap" id="progWrap">
      <div class="progress-bar-fill"></div>
    </div>

    <div class="status-text" id="statusText">Connecting to latest GitHub build...</div>

    <div>
      <span class="repo-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
        </svg>
        kml-convertor/app/index.html
      </span>
    </div>

    <div class="error-box" id="errorBox">
      <div id="errorMsg">Could not load the remote repository build.</div>
      <button class="btn-retry" id="btnRetry">Try Again</button>
    </div>
  </div>

  <script>
    const GITHUB_RAW_URL = 'https://raw.githubusercontent.com/chaudaryyabdullah03-collab/kml-convertor/main/app/index.html';
    const DB_NAME = 'ExcelToKMLPro_WebCache';
    const STORE_NAME = 'app_store';
    const CACHE_KEY = 'latest_app_html';

    const statusText = document.getElementById('statusText');
    const errorBox = document.getElementById('errorBox');
    const errorMsg = document.getElementById('errorMsg');
    const btnRetry = document.getElementById('btnRetry');
    const radarAnim = document.getElementById('radarAnim');
    const progWrap = document.getElementById('progWrap');

    /* IndexedDB Storage Helper (Handles >4MB single file safely) */
    function openDatabase() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function getCachedHtml() {
      try {
        const db = await openDatabase();
        return new Promise((resolve) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const store = tx.objectStore(STORE_NAME);
          const req = store.get(CACHE_KEY);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (err) {
        return null;
      }
    }

    async function setCachedHtml(htmlContent) {
      try {
        const db = await openDatabase();
        return new Promise((resolve) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          const store = tx.objectStore(STORE_NAME);
          store.put(htmlContent, CACHE_KEY);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      } catch (err) {
        return false;
      }
    }

    /* Launch application directly into window */
    function launchApplication(htmlContent) {
      statusText.textContent = 'Launching application...';
      try {
        document.open();
        document.write(htmlContent);
        document.close();
      } catch (e) {
        console.error('Error launching HTML:', e);
        // Fallback to full-screen iframe if document.write fails
        const iframe = document.createElement('iframe');
        iframe.style.position = 'fixed';
        iframe.style.top = '0';
        iframe.style.left = '0';
        iframe.style.width = '100vw';
        iframe.style.height = '100vh';
        iframe.style.border = 'none';
        iframe.style.zIndex = '999999';
        document.body.innerHTML = '';
        document.body.appendChild(iframe);
        iframe.contentDocument.open();
        iframe.contentDocument.write(htmlContent);
        iframe.contentDocument.close();
      }
    }

    /* Main loader sequence */
    async function loadApp() {
      errorBox.style.display = 'none';
      if (radarAnim) radarAnim.style.display = 'flex';
      if (progWrap) progWrap.style.display = 'block';

      statusText.textContent = 'Checking for latest GitHub commit...';

      // 1. Check if offline
      if (!navigator.onLine) {
        statusText.textContent = 'Offline mode: Checking local cache...';
        const cached = await getCachedHtml();
        if (cached) {
          launchApplication(cached);
          return;
        } else {
          showError('You appear to be offline and no cached version is available yet. Please connect to the internet to load the app for the first time.');
          return;
        }
      }

      // 2. Fetch directly from GitHub raw with cache-busting timestamp
      const fetchUrl = `${GITHUB_RAW_URL}?_cb=${Date.now()}`;
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000); // 8-second timeout

      try {
        statusText.textContent = 'Downloading latest build from kml-convertor...';
        const res = await fetch(fetchUrl, {
          signal: controller.signal,
          headers: { 'Accept': 'text/html,application/xhtml+xml' }
        });
        clearTimeout(timeoutId);

        if (!res.ok) {
          throw new Error(`GitHub returned HTTP status ${res.status}`);
        }

        const html = await res.text();

        // Basic sanity check to ensure we received real HTML
        if (!html || !html.includes('<html') || html.length < 50000) {
          throw new Error('Downloaded file does not appear to be a valid build.');
        }

        statusText.textContent = 'Updating local cache...';
        await setCachedHtml(html);

        statusText.textContent = 'Ready! Launching...';
        setTimeout(() => {
          launchApplication(html);
        }, 150);

      } catch (err) {
        clearTimeout(timeoutId);
        console.warn('Remote fetch failed, checking local cache:', err);

        // Try offline/cached fallback
        const cached = await getCachedHtml();
        if (cached) {
          statusText.textContent = 'Network unavailable: Launching cached version...';
          setTimeout(() => {
            launchApplication(cached);
          }, 300);
        } else {
          showError(`Could not load latest app build from GitHub (${err.message || 'Network Timeout'}). Please check your internet connection.`);
        }
      }
    }

    function showError(msg) {
      if (radarAnim) radarAnim.style.display = 'none';
      if (progWrap) progWrap.style.display = 'none';
      statusText.textContent = 'Failed to load';
      errorMsg.textContent = msg;
      errorBox.style.display = 'block';
    }

    btnRetry.addEventListener('click', () => {
      loadApp();
    });

    // Start on DOM ready
    window.addEventListener('DOMContentLoaded', loadApp);
  </script>
</body>
</html>
